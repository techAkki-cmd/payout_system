services:
  db:
    image: postgres:15
    container_name: payout_system_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: payout_system
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d payout_system"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
    container_name: payout_system_web
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      PROJECT_NAME: User Payout Management System
      API_V1_STR: /api/v1
      POSTGRES_SERVER: db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: payout_system
      POSTGRES_PORT: 5432
      BACKEND_CORS_ORIGINS: '["http://localhost","http://localhost:3000","http://localhost:8000"]'
      ENVIRONMENT: local
      AUTO_CREATE_TABLES: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
